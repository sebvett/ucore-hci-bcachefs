name: Build image

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # uCore publishes its images around 03:00 UTC.
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ucore-hci-bcachefs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build
        run: |
          set -o pipefail
          podman build --pull=always -t "${IMAGE}:lts" -f Containerfile . 2>&1 | tee build.log

      # Annotations are readable through the API without signing in, unlike
      # the job log.
      - name: Report the build failure
        if: failure()
        run: |
          tail -n 80 build.log | python3 -c 'import sys; s=sys.stdin.read().replace("%","%25").replace("\r","%0D").replace("\n","%0A"); print("::error title=build log tail::"+s)'

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          kver=$(podman run --rm "${IMAGE}:lts" ls /usr/lib/modules)
          dated="lts-${kver%.*}-$(date -u +%Y%m%d)"
          podman tag "${IMAGE}:lts" "${IMAGE}:${dated}"
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push "${IMAGE}:lts"
          podman push "${IMAGE}:${dated}"
          echo "Pushed ${IMAGE}:lts and ${IMAGE}:${dated}" >> "$GITHUB_STEP_SUMMARY"
