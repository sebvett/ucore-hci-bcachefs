name: Build image

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # uCore publishes its images around 03:00 UTC.
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ucore-hci-bcachefs
  # Rootful podman with its storage on the runner's large /mnt disk: the base
  # image does not fit next to the runner's tools on /.
  PODMAN: sudo podman --root /mnt/containers

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build
        run: |
          set -o pipefail
          df -h / /mnt
          $PODMAN build --pull=always -t "${IMAGE}:lts" -f Containerfile . 2>&1 | tee build.log

      # Annotations are readable through the API without signing in, unlike
      # the job log.
      - name: Report the build failure
        if: failure()
        run: |
          df -h / /mnt >> build.log
          grep -vE '^(Copying (blob|config)|Getting image source|Writing manifest|Storing signatures)' build.log | tail -c 3500 | python3 -c 'import sys; s=sys.stdin.read().replace("%","%25").replace("\r","%0D").replace("\n","%0A"); print("::error title=build log tail::"+s)'

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          kver=$($PODMAN run --rm "${IMAGE}:lts" ls /usr/lib/modules)
          dated="lts-${kver%.*}-$(date -u +%Y%m%d)"
          $PODMAN tag "${IMAGE}:lts" "${IMAGE}:${dated}"
          echo "${{ secrets.GITHUB_TOKEN }}" | $PODMAN login ghcr.io -u "${{ github.actor }}" --password-stdin
          $PODMAN push "${IMAGE}:lts"
          $PODMAN push "${IMAGE}:${dated}"
          echo "Pushed ${IMAGE}:lts and ${IMAGE}:${dated}" >> "$GITHUB_STEP_SUMMARY"
